# Default values of the gateway settings, loaded by GatewayCore with the lowest precedence:
# environment variables, application.yaml and profiles all override them.
# They live here, not in application.yaml, so that they come along when the gateway is embedded
# in another application (which has its own application.yaml).

gateway.admin.username=${GATEWAY_ADMIN_USERNAME:admin}
# No default on purpose: the application refuses to start without it.
gateway.admin.password=${GATEWAY_ADMIN_PASSWORD:}

gateway.messages.default-ttl=${GATEWAY_DEFAULT_TTL:5m}
gateway.messages.max-ttl=${GATEWAY_MAX_TTL:24h}

gateway.dispatch.interval=${GATEWAY_DISPATCH_INTERVAL:2s}
gateway.dispatch.ack-timeout=${GATEWAY_ACK_TIMEOUT:60s}
gateway.dispatch.report-timeout=${GATEWAY_REPORT_TIMEOUT:10m}
gateway.dispatch.max-in-flight-per-device=${GATEWAY_MAX_IN_FLIGHT:3}
gateway.dispatch.max-attempts=${GATEWAY_MAX_ATTEMPTS:5}

gateway.dashboard.time-zone=${GATEWAY_TIME_ZONE:UTC}
