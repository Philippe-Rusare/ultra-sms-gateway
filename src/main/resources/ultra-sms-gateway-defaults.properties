# Default values of the gateway settings, loaded by GatewayCore with the lowest precedence:
# environment variables, application.yaml and profiles all override them.
# They live here, not in application.yaml, so that they come along when the gateway is embedded
# in another application (which has its own application.yaml).

gateway.admin.username=${GATEWAY_ADMIN_USERNAME:admin}
# No default on purpose: the application refuses to start without it.
gateway.admin.password=${GATEWAY_ADMIN_PASSWORD:}

gateway.messages.default-ttl=${GATEWAY_DEFAULT_TTL:5m}
gateway.messages.max-ttl=${GATEWAY_MAX_TTL:24h}

gateway.dispatch.interval=${GATEWAY_DISPATCH_INTERVAL:2s}
gateway.dispatch.ack-timeout=${GATEWAY_ACK_TIMEOUT:60s}
gateway.dispatch.report-timeout=${GATEWAY_REPORT_TIMEOUT:10m}
gateway.dispatch.max-in-flight-per-device=${GATEWAY_MAX_IN_FLIGHT:3}
gateway.dispatch.max-attempts=${GATEWAY_MAX_ATTEMPTS:5}

gateway.dashboard.time-zone=${GATEWAY_TIME_ZONE:UTC}

# Who signs in to the dashboard. "builtin": the single administrator above. "external": the application
# embedding the gateway provides its own security filter chain and users (see docs/architecture.md).
gateway.dashboard.login=${GATEWAY_DASHBOARD_LOGIN:builtin}

# Texts of the dashboard: i18n/gateway.properties (English) and i18n/gateway_fr.properties. The language
# follows the browser, English when it asks for one we do not have.
spring.messages.basename=i18n/gateway
spring.messages.fallback-to-system-locale=false
spring.web.locale=en

# Render a page completely before sending it: the CSRF token of a form needs the session, which can no
# longer be created once part of the page has been sent.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Webhooks (see docs/api.md, "Webhooks").
gateway.webhooks.interval=${GATEWAY_WEBHOOK_INTERVAL:5s}
gateway.webhooks.timeout=${GATEWAY_WEBHOOK_TIMEOUT:10s}
gateway.webhooks.max-attempts=${GATEWAY_WEBHOOK_MAX_ATTEMPTS:8}
gateway.webhooks.retention=${GATEWAY_WEBHOOK_RETENTION:7d}
# A self-hosted gateway usually calls applications of its own network. A shared service must not.
gateway.webhooks.allow-private-networks=${GATEWAY_WEBHOOK_ALLOW_PRIVATE_NETWORKS:true}
gateway.webhooks.require-https=${GATEWAY_WEBHOOK_REQUIRE_HTTPS:false}
# Oldest version of the Android app still accepted (e.g. 1.2.0); empty: all. Older phones are asked to update.
gateway.devices.minimum-app-version=${GATEWAY_MINIMUM_APP_VERSION:}
