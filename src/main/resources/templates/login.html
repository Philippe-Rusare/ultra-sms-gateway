<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{gw.login.title})}"></head>
<body class="auth">
<main class="auth-form-side">
    <div class="auth-form-wrap">
        <div class="auth-brand">
            <img th:src="@{/img/logo.svg}" src="../static/img/logo.svg" alt="" width="44" height="44">
            <div>
                <span class="auth-brand-name">Ultra SMS Gateway</span>
                <span class="auth-brand-sub" th:text="#{gw.login.sub}">Admin console</span>
            </div>
        </div>

        <h1 th:text="#{gw.login.welcome}">Welcome back</h1>
        <p class="muted" th:text="#{gw.login.intro}">Intro</p>

        <p th:if="${param.error}" class="notice notice-error" role="alert" th:text="#{gw.login.error}">Wrong username or password.</p>
        <p th:if="${param.logout}" class="notice" role="status" th:text="#{gw.login.out}">You are signed out.</p>

        <form th:action="@{/login}" method="post" class="stack auth-form">
            <label>
                <span><span th:text="#{gw.login.username}">Username</span> <span class="required" aria-hidden="true">*</span></span>
                <input type="text" name="username" autocomplete="username" th:placeholder="#{gw.login.username.placeholder}" required autofocus>
            </label>
            <label>
                <span><span th:text="#{gw.login.password}">Password</span> <span class="required" aria-hidden="true">*</span></span>
                <span class="password-field">
                    <input type="password" name="password" id="password" autocomplete="current-password"
                           th:placeholder="#{gw.login.password.placeholder}" required>
                    <button type="button" class="password-toggle" th:aria-label="#{gw.login.password.show}" aria-pressed="false"
                            th:data-show="#{gw.login.password.show}" th:data-hide="#{gw.login.password.hide}"
                            onclick="togglePassword(this)">
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </button>
                </span>
            </label>
            <button type="submit" class="auth-submit" th:text="#{gw.login.submit}">Sign in</button>
        </form>
    </div>
</main>

<aside class="auth-hero" aria-hidden="true">
    <svg class="auth-hero-art" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
        <circle cx="330" cy="70" r="60" fill="none" stroke="currentColor" stroke-width="22" opacity=".07"/>
        <circle cx="330" cy="70" r="130" fill="none" stroke="currentColor" stroke-width="22" opacity=".06"/>
        <circle cx="330" cy="70" r="200" fill="none" stroke="currentColor" stroke-width="22" opacity=".05"/>
        <circle cx="330" cy="70" r="270" fill="none" stroke="currentColor" stroke-width="22" opacity=".04"/>
    </svg>
    <div class="auth-hero-content">
        <div class="auth-hero-brand">
            <img th:src="@{/img/logo-inverse.svg}" src="../static/img/logo-inverse.svg" alt="" width="36" height="36">
            <span>Ultra SMS Gateway</span>
        </div>
        <h2 th:text="#{gw.login.hero}">Hero</h2>
        <p th:text="#{gw.login.hero.text}">Text</p>
        <ul>
            <li th:text="#{gw.login.hero.1}">1</li>
            <li th:text="#{gw.login.hero.2}">2</li>
            <li th:text="#{gw.login.hero.3}">3</li>
        </ul>
    </div>
</aside>

<script>
    function togglePassword(button) {
        var input = document.getElementById('password');
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(show));
        button.setAttribute('aria-label', show ? button.dataset.hide : button.dataset.show);
    }
</script>
</body>
</html>
