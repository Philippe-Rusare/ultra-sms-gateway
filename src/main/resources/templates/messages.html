<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{gw.messages.title})}"></head>
<body>
<header th:replace="~{fragments :: nav('messages')}"></header>
<main>
    <h1 th:text="#{gw.messages.title}">Messages</h1>

    <form th:action="@{/messages}" method="get" class="filters">
        <label><span th:text="#{gw.messages.filter.status}">Status</span>
            <select name="status">
                <option value="" th:text="#{gw.messages.filter.all}">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="#{'gw.status.' + ${s}}" th:selected="${s == status}">Queued</option>
            </select>
        </label>
        <label><span th:text="#{gw.messages.filter.recipient}">Recipient</span>
            <input type="search" name="recipient" th:value="${recipient}" placeholder="+243…"></label>
        <button type="submit" th:text="#{gw.messages.filter.submit}">Filter</button>
    </form>

    <div class="table-wrap">
    <table>
        <thead>
        <tr><th th:text="#{gw.col.created}">Created</th><th th:text="#{gw.col.recipient}">Recipient</th><th th:text="#{gw.col.status}">Status</th>
            <th th:text="#{gw.col.client}">Client</th><th th:text="#{gw.col.device}">Device</th><th class="num" th:text="#{gw.col.attempts}">Attempts</th>
            <th th:text="#{gw.col.reason}">Reason</th></tr>
        </thead>
        <tbody>
        <tr th:if="${page.empty}" class="empty-row"><td colspan="7"
            th:text="${status != null or !#strings.isEmpty(recipient)} ? #{gw.messages.empty.filtered} : #{gw.messages.empty}">No message yet.</td></tr>
        <tr th:each="m : ${page.content}">
            <td><a th:href="@{/messages/{id}(id=${m.id})}" th:text="${@fmt.dateTime(m.createdAt)}">2026-01-01</a></td>
            <td class="mono" th:text="${m.recipient}">+243…</td>
            <td><span th:replace="~{fragments :: status(${m.status.name()})}"></span></td>
            <td th:text="${apiKeyNames[m.apiKeyId]} ?: '—'">app</td>
            <td th:text="${m.deviceId} != null ? (${deviceNames[m.deviceId]} ?: '—') : '—'">phone</td>
            <td class="num" th:text="${m.attempts}">1</td>
            <td class="mono small" th:text="${m.failureReason} ?: ''"></td>
        </tr>
        </tbody>
    </table>
    </div>

    <nav th:replace="~{pagination :: pager(${page}, @{/messages(status=${status}, recipient=${recipient})}, 'gw.pager.messages')}"></nav>
</main>
</body>
</html>
