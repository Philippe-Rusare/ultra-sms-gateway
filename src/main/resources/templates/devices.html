<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{gw.devices.title})}"></head>
<body>
<header th:replace="~{fragments :: nav('devices')}"></header>
<main>
    <div class="page-head">
        <div>
            <h1 th:text="#{gw.devices.title}">Devices</h1>
            <p class="muted" th:text="#{gw.devices.intro}">Intro</p>
            <p th:if="${allowance.limit != null}" class="small device-allowance" th:classappend="${allowance.full()} ? 'is-full'">
                <span th:text="#{gw.devices.limit(${allowance.used}, ${allowance.limit})}">1 of 1 phones in your plan</span>
                <a th:if="${allowance.upgradePath != null}" th:href="@{${allowance.upgradePath}}" th:text="#{gw.devices.limit.upgrade}">Change plan</a>
            </p>
        </div>
        <button type="button" data-dialog="add-device" th:text="#{gw.devices.add}">Add a device</button>
    </div>
    <th:block th:replace="~{extensions :: page-top}"></th:block>

    <th:block th:replace="~{fragments :: error}"></th:block>
    <div th:replace="~{fragments :: issued('gw.issued.device')}"></div>

    <dl class="details">
        <dt th:text="#{gw.devices.server}">Server URL</dt><dd><code th:text="${serverUrl}">ws://localhost:8080/v1/device/ws</code></dd>
    </dl>

    <!-- Each phone as the home screen of the app shows it: its state on the blue, then SIM, battery and signal. -->
    <div class="device-grid">
        <div th:each="view : ${page.content}" th:with="d=${view.device}" class="device-card"
             th:classappend="${!d.active} ? 'revoked' : (${!view.online} ? 'offline')">
            <div class="device-top">
                <svg th:replace="~{phone-ui :: rings}"></svg>
                <div class="device-title">
                    <img th:src="@{/img/logo-inverse.svg}" alt="" width="30" height="30">
                    <span class="device-name"><strong th:text="${d.name}">Phone</strong>
                        <span th:text="(${d.appVersion} != null ? #{gw.devices.app(${d.appVersion})} + ' · ' : '') + ${d.tokenPrefix} + '…'">App 0.2.0 · usgd_…</span></span>
                    <span th:if="${!d.active}" class="badge status-failed" th:text="#{gw.state.revoked}">Revoked</span>
                    <span th:if="${view.paused}" class="badge status-dispatched" th:title="#{gw.devices.paused.hint}" th:text="#{gw.devices.paused}">Paused</span>
                    <span th:if="${d.active and @appVersionPolicy.isTooOld(d.appVersion)}" class="badge status-dispatched"
                          th:title="#{gw.devices.update.hint(${@appVersionPolicy.minimum()})}" th:text="#{gw.devices.update}">Update needed</span>
                    <th:block th:if="${d.active}"><span th:replace="~{phone-ui :: state-badge(${view.online})}"></span></th:block>
                </div>
                <p class="device-since" th:text="${view.online} ? #{gw.devices.connected(${@fmt.dateTime(d.lastConnectedAt)})} : (${d.lastSeenAt} != null ? #{gw.devices.seen(${@fmt.dateTime(d.lastSeenAt)})} : #{gw.devices.never})">Connected since …</p>
                <div class="vitals on-blue">
                    <span class="vital"><svg th:replace="~{phone-ui :: sim}"></svg>
                        <span><strong th:text="${d.operatorName} ?: '—'">Vodacom</strong><span th:text="${d.networkType == null} ? #{gw.vital.sim} : (${d.networkType == 'WIFI'} ? 'Wi-Fi' : (${d.networkType == 'CELLULAR'} ? #{gw.network.cellular} : ${d.networkType}))">4G</span></span></span>
                    <span class="vital"><svg th:replace="~{phone-ui :: battery(${d.batteryLevel}, ${d.charging})}"></svg>
                        <span><strong th:text="${d.batteryLevel} != null ? ${d.batteryLevel} + ' %' : '—'">87 %</strong>
                            <span th:text="${d.charging} ? #{gw.vital.charging} : #{gw.vital.unplugged}">Charging</span></span></span>
                    <span class="vital"><svg th:replace="~{phone-ui :: signal(${view.online} ? ${d.signalLevel} : 0)}"></svg>
                        <span><strong th:text="${view.online and d.signalLevel != null} ? ${d.signalLevel} + ' / 4' : '—'">3 / 4</strong>
                            <span th:text="${view.online and d.signalLevel != null} ? #{'gw.vital.signal.' + ${d.signalLevel}} : #{gw.state.offline}">Good</span></span></span>
                </div>
            </div>
            <div class="device-actions">
                <button type="button" class="secondary small" data-dialog="rename-device"
                        th:data-action="@{/devices/{id}/rename(id=${d.id})}" th:data-set-name="${d.name}"
                        th:text="#{gw.common.rename}">Rename</button>
                <form th:if="${d.active}" th:action="@{/devices/{id}/revoke(id=${d.id})}" method="post"
                      th:data-confirm="#{gw.devices.revoke.text}" th:data-confirm-title="#{gw.devices.revoke.title}"
                      th:data-confirm-ok="#{gw.devices.revoke}" th:data-confirm-cancel="#{gw.confirm.cancel}">
                    <button type="submit" class="danger small" th:text="#{gw.devices.revoke}">Revoke</button>
                </form>
            </div>
        </div>
        <button type="button" class="device-add" data-dialog="add-device">
            <span class="device-add-icon" aria-hidden="true">+</span>
            <strong th:text="#{gw.devices.add}">Add a device</strong>
            <span class="muted small" th:text="#{gw.devices.add.hint}">Open the app on the phone and scan the QR code.</span>
        </button>
    </div>
    <nav th:replace="~{pagination :: pager(${page}, @{/devices}, 'gw.pager.devices')}"></nav>

    <dialog class="modal" id="add-device" aria-labelledby="add-device-title">
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="add-device-title" th:text="#{gw.devices.add.title}">Add a device</h2>
                <button type="button" class="link modal-close" data-dialog-close th:aria-label="#{gw.common.close}">×</button>
            </div>
            <form th:action="@{/devices/pair}" method="post">
                <div class="modal-body stack">
                    <p class="muted" th:text="#{gw.devices.add.intro}">Intro</p>
                    <label><span th:text="#{gw.common.name}">Name</span>
                        <input type="text" name="name" maxlength="100" th:placeholder="#{gw.devices.add.placeholder}" required autofocus></label>
                    <p class="muted small" th:text="#{gw.devices.add.token.hint}">Hint</p>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="secondary" th:formaction="@{/devices}" th:text="#{gw.devices.add.token}">Create a token instead</button>
                    <button type="submit" th:text="#{gw.devices.add.qr}">Continue with a QR code</button>
                </div>
            </form>
        </div>
    </dialog>

    <dialog class="modal modal-small" id="rename-device" aria-labelledby="rename-device-title">
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="rename-device-title" th:text="#{gw.devices.rename.title}">Rename</h2>
                <button type="button" class="link modal-close" data-dialog-close th:aria-label="#{gw.common.close}">×</button>
            </div>
            <form method="post" th:action="@{/devices}">
                <div class="modal-body stack">
                    <label><span th:text="#{gw.common.name}">Name</span><input type="text" name="name" maxlength="100" required></label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary" data-dialog-close th:text="#{gw.common.cancel}">Cancel</button>
                    <button type="submit" th:text="#{gw.common.save}">Save</button>
                </div>
            </form>
        </div>
    </dialog>
</main>
</body>
</html>
