<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{gw.pairing.title})}"></head>
<body>
<header th:replace="~{fragments :: nav('devices')}"></header>
<main>
    <p><a th:href="@{/devices}" th:text="#{gw.pairing.back}">← Devices</a></p>
    <h1 th:text="#{gw.pairing.heading(${pairing.deviceName})}">Add phone</h1>

    <div th:if="${status.name() == 'PAIRED'}" class="notice" role="status">
        <strong th:text="#{gw.pairing.paired}">The phone is paired.</strong> <a th:href="@{/devices}" th:text="#{gw.pairing.paired.where}">Devices</a>
    </div>
    <div th:if="${status.name() == 'EXPIRED'}" class="notice notice-error" role="alert">
        <span th:text="#{gw.pairing.expired}">Expired.</span> <a th:href="@{/devices}" th:text="#{gw.pairing.again}">Add the device again</a>
    </div>
    <div th:if="${status.name() == 'PENDING' and qr == null}" class="notice notice-error" role="alert">
        <span th:text="#{gw.pairing.once}">Shown once.</span> <a th:href="@{/devices}" th:text="#{gw.pairing.again}">Add the device again</a>
    </div>

    <section th:if="${status.name() == 'PENDING' and qr != null}" class="pairing" id="pairing"
             th:attr="data-status-url=@{/devices/pair/{id}/status(id=${pairing.id})},data-devices-url=@{/devices},data-paired=#{gw.pairing.paired},data-expired=#{gw.pairing.expired}">
        <div class="pairing-qr">
            <svg th:attr="viewBox='0 0 ' + ${qr.size} + ' ' + ${qr.size}" role="img" th:aria-label="#{gw.pairing.qr.label}"
                 shape-rendering="crispEdges">
                <path th:attr="d=${qr.path}" fill="#000"/>
            </svg>
        </div>
        <div>
            <ol>
                <li th:text="#{gw.pairing.step1}">Install</li>
                <li th:text="#{gw.pairing.step2}">Scan</li>
                <li th:text="#{gw.pairing.step3}">Start</li>
            </ol>
            <p class="muted" th:text="#{gw.pairing.expires(${@fmt.dateTime(pairing.expiresAt)})}">Expires.</p>
            <p id="pairing-state" class="muted" role="status" th:text="#{gw.pairing.waiting}">Waiting for the phone…</p>
            <details>
                <summary th:text="#{gw.pairing.cannot}">The phone cannot scan?</summary>
                <p class="muted small" th:text="#{gw.pairing.cannot.text}">Copy this link.</p>
                <code class="pairing-link" th:text="${pairingLink}">ultrasms://pair?…</code>
            </details>
        </div>
    </section>
</main>

<script th:inline="none">
    (function () {
        var box = document.getElementById('pairing');
        if (!box) return;
        var state = document.getElementById('pairing-state');
        var timer = setInterval(function () {
            fetch(box.dataset.statusUrl, {headers: {'Accept': 'application/json'}})
                .then(function (response) { return response.ok ? response.json() : null; })
                .then(function (body) {
                    if (!body || body.status === 'PENDING') return;
                    clearInterval(timer);
                    if (body.status === 'PAIRED') {
                        state.textContent = box.dataset.paired;
                        window.location = box.dataset.devicesUrl;
                    } else {
                        state.textContent = box.dataset.expired;
                    }
                })
                .catch(function () { /* The next attempt will retry. */ });
        }, 2000);
    })();
</script>
</body>
</html>
