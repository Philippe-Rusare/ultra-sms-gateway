<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{gw.message.title})}"></head>
<body>
<header th:replace="~{fragments :: nav('messages')}"></header>
<main>
    <p><a th:href="@{/messages}" th:text="#{gw.message.back}">← Messages</a></p>
    <h1><span th:text="#{gw.message.title}">Message</span> <span class="mono small" th:text="${message.id}">id</span></h1>

    <dl class="details">
        <dt th:text="#{gw.col.status}">Status</dt><dd><span th:replace="~{fragments :: status(${message.status.name()})}"></span></dd>
        <dt th:text="#{gw.col.recipient}">Recipient</dt><dd class="mono" th:text="${message.recipient}">+243…</dd>
        <dt th:text="#{gw.message.text}">Text</dt>
        <dd class="muted" th:text="${message.body} != null ? #{gw.message.text.hidden(${message.bodyLength})} : #{gw.message.text.erased(${message.bodyLength})}">not shown</dd>
        <dt th:text="#{gw.col.client}">Client</dt><dd th:text="${apiKeyNames[message.apiKeyId]} ?: '—'">app</dd>
        <dt th:text="#{gw.message.reference}">Client reference</dt><dd class="mono" th:text="${message.clientReference} ?: '—'">—</dd>
        <dt th:text="#{gw.col.device}">Device</dt><dd th:text="${message.deviceId} != null ? (${deviceNames[message.deviceId]} ?: '—') : '—'">—</dd>
        <dt th:text="#{gw.col.attempts}">Attempts</dt><dd th:text="${message.attempts}">0</dd>
        <dt th:text="#{gw.message.failure}">Failure reason</dt><dd class="mono" th:text="${message.failureReason} ?: '—'">—</dd>
        <dt th:text="#{gw.col.created}">Created</dt><dd th:text="${@fmt.dateTime(message.createdAt)}">—</dd>
        <dt th:text="#{gw.message.expires}">Expires</dt><dd th:text="${@fmt.dateTime(message.expiresAt)}">—</dd>
        <dt th:text="#{gw.message.sent}">Sent</dt><dd th:text="${@fmt.dateTime(message.sentAt)}">—</dd>
        <dt th:text="#{gw.message.delivered}">Delivered</dt><dd th:text="${@fmt.dateTime(message.deliveredAt)}">—</dd>
    </dl>

    <h2 th:text="#{gw.message.history}">History</h2>
    <div class="table-wrap">
    <table>
        <thead><tr><th th:text="#{gw.col.time}">Time</th><th th:text="#{gw.col.status}">Status</th><th th:text="#{gw.col.device}">Device</th><th th:text="#{gw.col.detail}">Detail</th></tr></thead>
        <tbody>
        <tr th:each="e : ${events}">
            <td th:text="${@fmt.dateTime(e.createdAt)}">—</td>
            <td><span th:replace="~{fragments :: status(${e.status.name()})}"></span></td>
            <td th:text="${e.deviceId} != null ? (${deviceNames[e.deviceId]} ?: '—') : '—'">—</td>
            <td class="mono small" th:text="${e.detail} ?: ''"></td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
