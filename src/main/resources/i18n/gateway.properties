gw.login.hero=Send SMS through your own phones, at the price of your bundles.
gw.login.hero.text=A self-hosted gateway: your applications queue messages, Android phones send them with their SIM cards.
gw.login.hero.1=Your SIM, your price. Every SMS uses your operator’s bundles instead of a paid SMS API.
gw.login.hero.2=Nothing gets lost. Messages wait in the queue until a phone is online, and expire when they are no longer useful.
gw.login.hero.3=Everything is audited. Each status change is recorded; message texts are erased once sent.
