spring:
  application:
    name: ultra-sms-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smsgateway}
    username: ${DB_USERNAME:smsgateway}
    password: ${DB_PASSWORD:smsgateway}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* headers from the reverse proxy that terminates TLS.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# The gateway.* settings (admin user, time to live, dispatch, dashboard time zone) have their defaults in
# ultra-sms-gateway-defaults.properties; set the GATEWAY_* environment variables, or override them here.
