# Ultra SMS Gateway: PostgreSQL + the gateway, from the image published on Docker Hub.
# Copy .env.example to .env, set the passwords, then: docker compose up -d
# To build the gateway from the sources instead, see docker-compose.dev.yml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smsgateway}
      POSTGRES_USER: ${DB_USERNAME:-smsgateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    # Pinned version: change it (or set GATEWAY_IMAGE in .env) to upgrade, then docker compose pull && docker compose up -d.
    image: ${GATEWAY_IMAGE:-philipperusare/ultra-sms-gateway:0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smsgateway}
      DB_USERNAME: ${DB_USERNAME:-smsgateway}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set GATEWAY_ADMIN_PASSWORD in .env}
      GATEWAY_TIME_ZONE: ${GATEWAY_TIME_ZONE:-UTC}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
