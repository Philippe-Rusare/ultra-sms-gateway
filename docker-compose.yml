# Local or single-server deployment: PostgreSQL + the gateway.
# Copy .env.example to .env and set the passwords first.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smsgateway}
      POSTGRES_USER: ${DB_USERNAME:-smsgateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build: .
    # Locally: built from the sources. In production, Jenkins sets GATEWAY_IMAGE to the image published on Docker Hub.
    image: ${GATEWAY_IMAGE:-ultra-sms-gateway:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smsgateway}
      DB_USERNAME: ${DB_USERNAME:-smsgateway}
      DB_PASSWORD: ${DB_PASSWORD}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set GATEWAY_ADMIN_PASSWORD in .env}
      GATEWAY_TIME_ZONE: ${GATEWAY_TIME_ZONE:-UTC}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
